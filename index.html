<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stego Builder — Deterministic Semagram Generator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>Stego Builder</h1>
        <p class="subtitle">Deterministic SVG semagrams — hide short messages in plain sight</p>
      </div>
      <div class="header-actions">
        <button id="btn-download-svg" class="btn btn-secondary" type="button">Download SVG</button>
        <button id="btn-download-png" class="btn btn-primary" type="button">Download PNG</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="controls-panel" aria-label="Encoding controls">
        <div class="control-group">
          <label for="message-input" class="control-label">
            Secret Message
            <span id="char-count" class="badge">0 items</span>
          </label>
          <input
            id="message-input"
            type="text"
            maxlength="24"
            value="SOS"
            placeholder="e.g. SOS, HELLO, DAWN"
            autocomplete="off"
          />
          <p id="encoding-note" class="helper-text"></p>
        </div>

        <div class="control-group">
          <span class="control-label">Encoding Cipher</span>
          <div class="segmented" role="group" aria-label="Encoding Cipher">
            <button type="button" class="seg-btn active" data-cipher="morse">Morse</button>
            <button type="button" class="seg-btn" data-cipher="alphabetic">Alphabetic (A1Z26)</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Carrier Channel</span>
          <div class="segmented" role="group" aria-label="Carrier Channel">
            <button type="button" class="seg-btn active" data-channel="size">Size</button>
            <button type="button" class="seg-btn" data-channel="position">Position (Spacing)</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Target Element</span>
          <div class="element-grid" role="group" aria-label="Target Element">
            <button type="button" class="elem-btn active" data-element="birds">Birds</button>
            <button type="button" class="elem-btn" data-element="trees">Trees</button>
            <button type="button" class="elem-btn" data-element="mountains">Mountains</button>
            <button type="button" class="elem-btn" data-element="clouds">Clouds</button>
            <button type="button" class="elem-btn" data-element="fence">Fence Posts</button>
          </div>
        </div>

        <hr class="divider" />

        <div class="control-group">
          <label for="palette-select" class="control-label">Scene Palette</label>
          <select id="palette-select">
            <option value="daylight">Daylight</option>
            <option value="golden">Golden Hour</option>
            <option value="twilight">Twilight</option>
          </select>
        </div>

        <div class="control-group">
          <label for="subtlety-slider" class="control-label">
            Subtlety
            <span id="subtlety-label" class="badge">Balanced</span>
          </label>
          <input id="subtlety-slider" type="range" min="0" max="1" step="0.05" value="0.35" />
        </div>

        <div class="toggles-row">
          <label class="checkbox-label">
            <input id="toggle-camouflage" type="checkbox" checked />
            <span>Background camouflage</span>
          </label>
          <label class="checkbox-label">
            <input id="toggle-overlay" type="checkbox" />
            <span>Show solution overlay</span>
          </label>
        </div>

        <button id="btn-randomize" class="btn btn-secondary btn-full" type="button">
          Randomize Scenery (Seed: <span id="seed-display">42</span>)
        </button>
      </aside>

      <section class="preview-panel" aria-label="Generated semagram preview">
        <div id="canvas-stage" class="canvas-stage"></div>
        <div class="breakdown-bar">
          <span class="breakdown-title">Encoded Sequence:</span>
          <code id="encoding-summary" class="breakdown-code"></code>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
